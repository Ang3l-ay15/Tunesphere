        <div class="floating-word" id="float"><strong><em>DAVID RULES</em></strong></div>
        <script>
                        const word = document.getElementById('float');
            let x = 100;
            let y = 200;
            let dx = 2.5; // speed x
            let dy = 2; // speed y
            function animate() {
                const wordWidth = word.offsetWidth;
                const wordHeight = word.offsetHeight;
                x += dx;
                y += dy;
                //bounce off edges
                if (x + wordWidth >
                    window.innerWidth || x < 0){
                        dx = -dx;
                    }
                    if (y + wordHeight >
                        window.innerHeight || y < 0){
                            dy = -dy;
                        }
                        word.style.left = x + 'px';
                        word.style.top = y + 'px';
                        requestAnimationFrame(animate);
            }

            // start from random position
            x = Math.random() *
            (window.innerWidth - 200);
            y = Math.random() *
            (window.innerHeight - 100);
                    animate();
            // resize fix
            window.addEventListener('resize', ()=>{
                x = Math.min(x,
                    window.innerWidth - word,offsetWidth);
                y = Math.min(y,
            window.innerHeight - word.offsetHeight);
            });
        </script>
    </body>
